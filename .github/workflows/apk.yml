name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # opcional: chave grátis do Google Books (Settings > Secrets > GOOGLE_BOOKS_KEY); sem ela o app usa a cota pública e o Open Library
      EXPO_PUBLIC_GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: 1

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Marcador-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Marcador-apk
          path: Marcador-*.apk

      - name: Publicar na página de versões
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Marcador 1.0.${{ github.run_number }}
          body: APK do Marcador. Abra este link no celular, baixe o arquivo .apk e instale.
          files: Marcador-*.apk
